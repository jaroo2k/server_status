<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버 모니터 관리자</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #fff; --text: #1d2127; --muted: #6b7280; --border: #e3e6ea;
    --accent: #2563eb; --accent-text: #fff; --hover: #f0f2f5;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
    --crit: #b91c1c; --crit-bg: #fee2e2; --gray: #4b5563; --gray-bg: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1e24; --text: #e5e7eb; --muted: #9ca3af; --border: #2c323a;
      --accent: #3b82f6; --hover: #22272e;
      --ok: #4ade80; --ok-bg: #14341f; --warn: #facc15; --warn-bg: #3a300f;
      --crit: #f87171; --crit-bg: #3f1616; --gray: #d1d5db; --gray-bg: #2c323a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .card .value.crit { color: var(--crit); } .card .value.warn { color: var(--warn); }
  .card .value.ok { color: var(--ok); } .card .value.gray { color: var(--gray); }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 20px; }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .section-head h2 { margin-right: auto; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  tr.selected { background: var(--hover); }
  td.actions { white-space: nowrap; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .msg { max-width: 520px; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .event-msg { display: block; width: 100%; min-width: 280px; max-width: 520px; padding: 4px 6px; margin: -4px -6px; background: none; border: 0; border-radius: 6px; text-align: left; }
  .event-msg:hover { background: var(--border); }
  .event-msg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .event-msg .desc { display: block; margin-bottom: 2px; }
  .event-msg .msg { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: var(--muted); }
  .err { color: var(--crit); font-size: 12px; max-width: 320px; word-break: break-all; }
  .clickable { cursor: pointer; color: inherit; text-decoration: none; }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .b-ok { color: var(--ok); background: var(--ok-bg); }
  .b-warning { color: var(--warn); background: var(--warn-bg); }
  .b-critical { color: var(--crit); background: var(--crit-bg); }
  .b-degraded, .b-source-fail { color: var(--crit); background: var(--crit-bg); }
  .b-source-ok { color: var(--ok); background: var(--ok-bg); }
  .b-unreachable, .b-unknown, .b-disabled, .b-source-pending { color: var(--gray); background: var(--gray-bg); }
  .tag { display: inline-block; padding: 0 6px; margin: 1px 2px 1px 0; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--muted); }

  button, select, input, textarea { font: inherit; color: var(--text); }
  button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--crit); }
  button.sm { padding: 2px 8px; font-size: 12px; }
  select, input, textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  #sources-dialog { width: min(1040px, calc(100vw - 32px)); }
  .sources-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .sources-head h2 { margin-right: auto; }
  #event-dialog { width: min(860px, calc(100vw - 32px)); }
  #event-dialog h3 { font-size: 14px; margin: 0 0 6px; }
  .event-body { padding: 16px 20px 20px; display: grid; gap: 16px; }
  .event-meaning { margin: 0; padding: 10px 12px; background: var(--hover); border-radius: 8px; }
  .event-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; margin: 0; }
  .event-meta dt { color: var(--muted); font-size: 12px; }
  .event-meta dd { margin: 0; word-break: break-word; }
  #event-dialog .msg { max-width: none; white-space: pre-wrap; }
  #event-dialog td.time { white-space: nowrap; }
  #event-note:empty { display: none; }
  #event-note { margin: 0 0 6px; }
  #event-dialog .history-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #event-dialog .history-filter h3 { margin: 0 auto 0 0; }
  #event-dialog .history-filter input { width: auto; }
  .history-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .history-more:empty { display: none; }
  #history .msg { color: var(--muted); }
  #h-event { max-width: 340px; }
  #history td.time { white-space: nowrap; }
  #sources-dialog .msg { max-width: 460px; }
  #sources-dialog .err { max-width: 460px; }
  #sources-dialog .hint { padding: 12px 20px; }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  dialog input, dialog select { width: 100%; }
  dialog label.inline { width: fit-content; cursor: pointer; }
  dialog input[type="checkbox"] { width: 16px; height: 16px; margin: 0; padding: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 10; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px;
           padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-width: 420px; word-break: break-all; }
  .toast.error { border-left-color: var(--crit); }
  .toast.success { border-left-color: var(--ok); }

  @media (max-width: 640px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    dialog .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>서버 모니터 관리자</h1>
  <span class="muted small" id="updated"></span>
  <label class="inline"><input type="checkbox" id="auto" checked> 10초마다 자동 새로고침</label>
  <button id="refresh">새로고침</button>
</header>

<main>
  <div class="cards" id="cards"></div>

  <section>
    <div class="section-head">
      <h2>서버</h2>
      <button class="primary" id="add-server">+ 서버 추가</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>이름</th><th>주소</th><th>상태</th><th>태그</th><th>수집 소스</th>
          <th>마지막 수집</th><th>오류</th><th>작업</th>
        </tr></thead>
        <tbody id="servers"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>이벤트</h2>
      <select id="f-server"><option value="">전체 서버</option></select>
      <select id="f-severity">
        <option value="">전체 심각도</option><option value="critical">critical</option><option value="warning">warning</option>
      </select>
      <select id="f-category">
        <option value="">전체 분류</option><option value="hardware">하드웨어</option><option value="server_error">서버 오류</option>
      </select>
      <select id="f-ack">
        <option value="false">미확인</option><option value="true">확인됨</option><option value="">전체</option>
      </select>
      <input id="f-q" type="search" placeholder="제목/메시지 검색">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>심각도</th><th>서버</th><th>분류</th><th>제목</th><th>메시지</th>
          <th>횟수</th><th>최초 발생</th><th>최근 발생</th><th></th>
        </tr></thead>
        <tbody id="events"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>발생 이력</h2>
      <select id="h-server" aria-label="서버"><option value="">전체 서버</option></select>
      <select id="h-severity" aria-label="심각도">
        <option value="">전체 심각도</option><option value="critical">critical</option><option value="warning">warning</option>
      </select>
      <select id="h-event" aria-label="이벤트"><option value="">전체 이벤트</option></select>
      <label class="inline">시작일 <input type="date" id="h-from"></label>
      <label class="inline">종료일 <input type="date" id="h-to"></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>발생 시각</th><th>서버</th><th>심각도</th><th>이벤트</th><th>원본 로그</th>
        </tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
    <div class="history-more" id="history-more"></div>
  </section>
</main>

<dialog id="server-dialog">
  <form method="dialog" id="server-form">
    <h2 id="dialog-title">서버 추가</h2>
    <div class="row">
      <label>이름 <input name="name" required maxlength="100"></label>
      <label>호스트 <input name="host" required placeholder="10.0.0.11"></label>
    </div>
    <div class="row">
      <label>포트 <input name="port" type="number" value="22" min="1" max="65535" required></label>
      <label>사용자 <input name="username" value="monitor" required></label>
    </div>
    <div class="row">
      <label>인증 방식
        <select name="auth_type"><option value="key">SSH 개인키</option><option value="password">비밀번호</option></select>
      </label>
      <label>태그 (쉼표로 구분) <input name="tags" placeholder="web, prod"></label>
    </div>
    <label><span id="secret-label">개인키</span>
      <textarea name="secret" rows="6" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
      <span class="small" id="secret-hint"></span>
    </label>
    <label class="inline"><input type="checkbox" name="enabled" checked> 수집 활성화</label>
    <div class="buttons">
      <button type="button" id="dialog-cancel">취소</button>
      <button type="submit" class="primary" id="dialog-save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="sources-dialog">
  <div class="sources-head">
    <h2 id="sources-title">수집 상세</h2>
    <button type="button" id="sources-close">닫기</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>소스</th><th>결과</th><th>마지막 실행</th><th>마지막 성공</th>
        <th>수집 건수</th><th>규칙 일치</th><th>소요 시간</th><th>명령 / 오류</th>
      </tr></thead>
      <tbody id="sources"></tbody>
    </table>
  </div>
  <p class="small muted hint">각 소스의 마지막 실행 결과입니다. 수집 건수는 소스에서 가져온 로그 수이고, 규칙에 일치한 로그만 이벤트로 저장됩니다.</p>
</dialog>

<dialog id="event-dialog">
  <div class="sources-head">
    <h2 id="event-title">이벤트 상세</h2>
    <button type="button" id="event-close">닫기</button>
  </div>
  <div class="event-body">
    <div>
      <h3>이 로그의 의미</h3>
      <p class="event-meaning" id="event-meaning"></p>
    </div>
    <dl class="event-meta" id="event-meta"></dl>
    <div>
      <div class="history-filter">
        <h3>발생 이력</h3>
        <label class="inline">시작일 <input type="date" id="event-from"></label>
        <label class="inline">종료일 <input type="date" id="event-to"></label>
      </div>
      <p class="small muted" id="event-note"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>발생 시각</th><th>원본 로그</th><th></th></tr></thead>
          <tbody id="event-lines"></tbody>
        </table>
      </div>
      <div class="history-more" id="event-more"></div>
    </div>
  </div>
</dialog>

<div id="toasts"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const STATUS_LABEL = { ok: "정상", warning: "경고", critical: "심각", degraded: "수집 오류", unreachable: "접속 불가", unknown: "미확인" };
const CATEGORY_LABEL = { hardware: "하드웨어", server_error: "서버 오류" };

let servers = [];
let editingId = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const sec = Math.round((Date.now() - d) / 1000);
  let rel;
  if (sec < 60) rel = `${Math.max(sec, 0)}초 전`;
  else if (sec < 3600) rel = `${Math.floor(sec / 60)}분 전`;
  else if (sec < 86400) rel = `${Math.floor(sec / 3600)}시간 전`;
  else rel = `${Math.floor(sec / 86400)}일 전`;
  return `<span title="${esc(d.toLocaleString())}">${rel}</span>`;
}

function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), kind === "error" ? 8000 : 4000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: opts.body ? { "Content-Type": "application/json" } : undefined,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = typeof body.detail === "string" ? body.detail : body.detail.map((d) => d.msg).join(", ");
    } catch {}
    throw new Error(`${res.status}: ${detail}`);
  }
  return res.status === 204 ? null : res.json();
}

// ---------- 요약 ----------
function renderSummary(s) {
  const st = s.servers_by_status, sev = s.open_events_by_severity, cat = s.open_events_by_category;
  const cards = [
    ["전체 서버", s.servers_total, ""],
    ["정상", st.ok || 0, "ok"],
    ["경고", st.warning || 0, "warn"],
    ["심각", st.critical || 0, "crit"],
    ["수집 오류", st.degraded || 0, "crit"],
    ["접속 불가", st.unreachable || 0, "gray"],
    ["미확인 critical 이벤트", sev.critical || 0, "crit"],
    ["미확인 warning 이벤트", sev.warning || 0, "warn"],
    ["하드웨어 / 서버 오류", `${cat.hardware || 0} / ${cat.server_error || 0}`, ""],
  ];
  $("#cards").innerHTML = cards
    .map(([label, value, cls]) => `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`)
    .join("");
}

// ---------- 서버 ----------
function statusBadge(s) {
  if (!s.enabled) return `<span class="badge b-disabled">비활성</span>`;
  return `<span class="badge b-${esc(s.status)}">${STATUS_LABEL[s.status] || esc(s.status)}</span>`;
}

function renderServers() {
  const selected = $("#f-server").value;
  const tbody = $("#servers");
  if (!servers.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">등록된 서버가 없습니다. "서버 추가"로 등록하세요.</td></tr>`;
  } else {
    tbody.innerHTML = servers.map((s) => `
      <tr data-id="${s.id}" class="${String(s.id) === selected ? "selected" : ""}">
        <td><a href="#" class="clickable" data-act="filter" title="이 서버의 이벤트만 보기"><b>${esc(s.name)}</b></a></td>
        <td>${esc(s.username)}@${esc(s.host)}:${s.port}<br><span class="small muted">${s.auth_type === "key" ? "키 인증" : "비밀번호"}${s.host_key_pinned ? " · 호스트 키 고정됨" : ""}</span></td>
        <td>${statusBadge(s)}</td>
        <td>${s.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("") || '<span class="muted">-</span>'}</td>
        <td class="small">${s.capabilities.map(esc).join("<br>") || '<span class="muted">미탐지</span>'}</td>
        <td>${fmtTime(s.last_collected_at)}</td>
        <td>${s.last_error ? `<div class="err">${esc(s.last_error)}</div>${s.consecutive_failures ? `<span class="small muted">연속 실패 ${s.consecutive_failures}회</span>` : ""}` : '<span class="muted">-</span>'}</td>
        <td class="actions">
          <button class="sm" data-act="sources">수집 상세</button>
          <button class="sm" data-act="test">연결 테스트</button>
          <button class="sm" data-act="edit">수정</button>
          <button class="sm" data-act="toggle">${s.enabled ? "비활성화" : "활성화"}</button>
          ${s.host_key_pinned ? '<button class="sm" data-act="reset-key">호스트 키 초기화</button>' : ""}
          <button class="sm danger" data-act="delete">삭제</button>
        </td>
      </tr>`).join("");
  }

  const sel = $("#f-server");
  sel.innerHTML = `<option value="">전체 서버</option>` +
    servers.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  sel.value = servers.some((s) => String(s.id) === selected) ? selected : "";

  const historySel = $("#h-server");
  const historySelected = historySel.value;
  historySel.innerHTML = sel.innerHTML;
  historySel.value = servers.some((s) => String(s.id) === historySelected) ? historySelected : "";
}

$("#servers").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  e.preventDefault();
  const id = Number(btn.closest("tr").dataset.id);
  const s = servers.find((x) => x.id === id);
  const act = btn.dataset.act;

  if (act === "filter") {
    $("#f-server").value = $("#f-server").value === String(id) ? "" : String(id);
    renderServers();
    return loadEvents();
  }
  if (act === "edit") return openDialog(s);
  if (act === "sources") return openSources(s);

  btn.disabled = true;
  try {
    if (act === "test") {
      const r = await api(`/api/servers/${id}/test`, { method: "POST" });
      if (r.ok) toast(`${s.name}: 연결 성공 (${r.capabilities.join(", ") || "수집 소스 없음"})`, "success");
      else toast(`${s.name}: 연결 실패 - ${r.error}`, "error");
    } else if (act === "toggle") {
      await api(`/api/servers/${id}`, { method: "PATCH", body: JSON.stringify({ enabled: !s.enabled }) });
      toast(`${s.name}: ${s.enabled ? "비활성화" : "활성화"}했습니다`, "success");
    } else if (act === "reset-key") {
      if (!confirm(`${s.name}의 고정된 호스트 키를 초기화할까요?\nOS 재설치 등으로 키가 정상적으로 바뀐 경우에만 하세요. 다음 접속 때 새 키가 고정됩니다.`)) return;
      await api(`/api/servers/${id}/reset-host-key`, { method: "POST" });
      toast(`${s.name}: 호스트 키를 초기화했습니다`, "success");
    } else if (act === "delete") {
      if (!confirm(`${s.name} 서버를 삭제할까요?\n이 서버의 이벤트도 함께 삭제됩니다.`)) return;
      await api(`/api/servers/${id}`, { method: "DELETE" });
      toast(`${s.name}: 삭제했습니다`, "success");
    }
    await refresh();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    btn.disabled = false;
  }
});

// ---------- 서버 추가/수정 ----------
const dialog = $("#server-dialog");
const form = $("#server-form");

function updateSecretLabel() {
  const isKey = form.auth_type.value === "key";
  $("#secret-label").textContent = isKey ? "개인키" : "비밀번호";
  form.secret.rows = isKey ? 6 : 1;
  form.secret.placeholder = isKey ? "-----BEGIN OPENSSH PRIVATE KEY-----" : "";
}
form.auth_type.addEventListener("change", updateSecretLabel);

function openDialog(s = null) {
  editingId = s ? s.id : null;
  form.reset();
  $("#dialog-title").textContent = s ? `서버 수정: ${s.name}` : "서버 추가";
  if (s) {
    for (const k of ["name", "host", "port", "username", "auth_type"]) form[k].value = s[k];
    form.tags.value = s.tags.join(", ");
    form.enabled.checked = s.enabled;
  }
  form.secret.required = !s;
  $("#secret-hint").textContent = s ? "비워 두면 기존 인증정보를 유지합니다." : "암호화되어 저장되며 다시 조회할 수 없습니다.";
  updateSecretLabel();
  dialog.showModal();
}

$("#add-server").addEventListener("click", () => openDialog());
$("#dialog-cancel").addEventListener("click", () => dialog.close());

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    name: form.name.value.trim(),
    host: form.host.value.trim(),
    port: Number(form.port.value),
    username: form.username.value.trim(),
    auth_type: form.auth_type.value,
    tags: form.tags.value.split(",").map((t) => t.trim()).filter(Boolean),
    enabled: form.enabled.checked,
  };
  let secret = form.secret.value.replace(/\r/g, "");
  if (body.auth_type === "key" && secret.trim()) secret = secret.trim() + "\n";
  if (secret) body.secret = secret;

  const save = $("#dialog-save");
  save.disabled = true;
  try {
    if (editingId) {
      await api(`/api/servers/${editingId}`, { method: "PATCH", body: JSON.stringify(body) });
      toast(`${body.name}: 수정했습니다`, "success");
      dialog.close();
    } else {
      const created = await api("/api/servers", { method: "POST", body: JSON.stringify(body) });
      dialog.close();
      toast(`${body.name}: 등록했습니다. 연결을 테스트하는 중...`);
      const r = await api(`/api/servers/${created.id}/test`, { method: "POST" });
      if (r.ok) toast(`${body.name}: 연결 성공 (${r.capabilities.join(", ") || "수집 소스 없음"})`, "success");
      else toast(`${body.name}: 연결 실패 - ${r.error}`, "error");
    }
    await refresh();
  } catch (err) {
    toast(err.message, "error");
  } finally {
    save.disabled = false;
  }
});

// ---------- 수집 상세 ----------
const SOURCE_LABEL = { journal: "시스템 저널 (journalctl)", systemd: "실패한 서비스 (systemctl)", dmesg: "커널 로그 (dmesg)" };
const sourcesDialog = $("#sources-dialog");
let sourcesServerId = null;

function sourceBadge(src) {
  if (src.ok === null) return '<span class="badge b-source-pending">대기 중</span>';
  return src.ok ? '<span class="badge b-source-ok">성공</span>' : '<span class="badge b-source-fail">실패</span>';
}

async function loadSources() {
  const requestedId = sourcesServerId;
  const list = await api(`/api/servers/${requestedId}/sources`);
  if (requestedId !== sourcesServerId) return;  // 응답 전에 다른 서버를 연 경우
  const tbody = $("#sources");
  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">활성화된 수집 소스가 없습니다. 연결 테스트로 기능을 탐지하세요.</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map((src) => `
    <tr>
      <td>${esc(SOURCE_LABEL[src.source] || src.source)}</td>
      <td>${sourceBadge(src)}</td>
      <td>${fmtTime(src.last_run_at)}</td>
      <td>${fmtTime(src.last_success_at)}</td>
      <td>${src.ok === true ? `${src.records}건` : "-"}</td>
      <td>${src.ok === true ? `${src.findings}건` : "-"}</td>
      <td>${src.ok === null ? "-" : `${src.duration_ms}ms`}</td>
      <td>
        ${src.error ? `<div class="err">${esc(src.error)}</div>` : ""}
        ${src.command ? `<div class="msg muted">${esc(src.command)}</div>` : ""}
      </td>
    </tr>`).join("");
}

async function openSources(s) {
  sourcesServerId = s.id;
  $("#sources-title").textContent = `수집 상세: ${s.name}`;
  $("#sources").innerHTML = `<tr><td colspan="8" class="empty">불러오는 중...</td></tr>`;
  sourcesDialog.showModal();
  try {
    await loadSources();
  } catch (err) {
    toast(err.message, "error");
  }
}

$("#sources-close").addEventListener("click", () => sourcesDialog.close());

// ---------- 이벤트 ----------
let eventsById = new Map();

async function loadEvents() {
  const params = new URLSearchParams({ limit: "200" });
  const map = { server_id: "#f-server", severity: "#f-severity", category: "#f-category", acknowledged: "#f-ack", q: "#f-q" };
  for (const [k, sel] of Object.entries(map)) {
    const v = $(sel).value.trim();
    if (v) params.set(k, v);
  }
  const events = await api(`/api/events?${params}`);
  eventsById = new Map(events.map((ev) => [ev.id, ev]));
  const tbody = $("#events");
  if (!events.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty">조건에 맞는 이벤트가 없습니다.</td></tr>`;
    return;
  }
  tbody.innerHTML = events.map((ev) => `
    <tr data-id="${ev.id}">
      <td><span class="badge b-${esc(ev.severity)}">${esc(ev.severity)}</span></td>
      <td>${esc(ev.server_name)}</td>
      <td>${CATEGORY_LABEL[ev.category] || esc(ev.category)}<br><span class="small muted">${esc(ev.rule_id)}</span></td>
      <td>${esc(ev.title)}<br><span class="small muted">${esc(ev.source)}</span></td>
      <td>
        <button type="button" class="event-msg" data-act="detail" title="클릭하여 상세 로그 보기">
          <span class="desc">${esc(ev.description)}</span>
          <span class="msg">${esc(ev.message)}</span>
        </button>
      </td>
      <td>${ev.count}</td>
      <td>${fmtTime(ev.first_seen)}</td>
      <td>${fmtTime(ev.last_seen)}</td>
      <td class="actions">${ev.acknowledged ? '<span class="muted small">확인됨</span>' : '<button class="sm" data-act="ack">확인</button>'}</td>
    </tr>`).join("");
}

async function copyText(text) {
  // navigator.clipboard는 HTTPS/localhost에서만 제공되므로 HTTP 접속 시 execCommand로 대체
  if (navigator.clipboard) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  // 모달이 열려 있으면 그 밖의 요소는 선택되지 않으므로 모달 안에 넣음
  (document.querySelector("dialog[open]") || document.body).append(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("클립보드 복사에 실패했습니다");
}

// ---------- 발생 이력 공통 ----------
const HISTORY_PAGE = 100;

function historyQuery(filters, fromEl, toEl, offset) {
  const params = new URLSearchParams({ limit: String(HISTORY_PAGE), offset: String(offset) });
  for (const [k, v] of Object.entries(filters)) if (v) params.set(k, v);
  // 날짜 입력은 브라우저 시간대 기준. 종료일은 그날 끝까지 포함하도록 다음 날 0시 전까지 조회
  if (fromEl.value) params.set("from", new Date(`${fromEl.value}T00:00`).toISOString());
  if (toEl.value) {
    const end = new Date(`${toEl.value}T00:00`);
    end.setDate(end.getDate() + 1);
    params.set("to", end.toISOString());
  }
  return `/api/occurrences?${params}`;
}

// 조회 사이에 새 로그가 쌓이면 다음 페이지가 겹칠 수 있어 id로 중복을 제거
function appendLines(lines, page) {
  const seen = new Set(lines.map((l) => l.id));
  return lines.concat(page.filter((l) => !seen.has(l.id)));
}

function moreBar(shown, total, moreId) {
  return shown < total
    ? `<span class="small muted">${total.toLocaleString()}건 중 ${shown.toLocaleString()}건 표시</span><button type="button" id="${moreId}">더 보기</button>`
    : "";
}

// ---------- 전체 발생 이력 ----------
let historyLines = [];
let historyRequest = 0;
let historyEvents = [];

// 고른 서버·심각도에 속한 이벤트만 선택지로 보여줌
function renderHistoryEventOptions() {
  const sel = $("#h-event");
  const selected = sel.value;
  const server = $("#h-server").value;
  const severity = $("#h-severity").value;
  const events = historyEvents
    .filter((ev) => (!server || String(ev.server_id) === server) && (!severity || ev.severity === severity))
    .sort((a, b) => b.id - a.id);
  const html = `<option value="">전체 이벤트</option>` + events
    .map((ev) => `<option value="${ev.id}">${esc(`[${ev.server_name}] ${ev.title} - ${ev.message.slice(0, 40)}`)}</option>`)
    .join("");
  // 자동 새로고침이 펼쳐 놓은 목록을 닫지 않도록 바뀌었을 때만 다시 그림
  if (sel.dataset.options !== html) {
    sel.innerHTML = html;
    sel.dataset.options = html;
  }
  sel.value = events.some((ev) => String(ev.id) === selected) ? selected : "";
}

async function loadHistory({ more = false } = {}) {
  const request = ++historyRequest;
  const page = await api(historyQuery(
    { server_id: $("#h-server").value, severity: $("#h-severity").value, event_id: $("#h-event").value },
    $("#h-from"), $("#h-to"), more ? historyLines.length : 0,
  ));
  if (request !== historyRequest) return;  // 응답 전에 조건을 바꾼 경우
  historyLines = more ? appendLines(historyLines, page.items) : page.items;
  const tbody = $("#history");
  tbody.innerHTML = historyLines.map((line) => `
    <tr data-event="${line.event_id}">
      <td class="time small">${esc(new Date(line.seen_at).toLocaleString())}</td>
      <td>${esc(line.server_name)}</td>
      <td><span class="badge b-${esc(line.severity)}">${esc(line.severity)}</span></td>
      <td>${esc(line.title)}<br><span class="small muted">${esc(line.rule_id)}</span></td>
      <td><button type="button" class="event-msg" data-act="detail" title="클릭하여 이벤트 상세 보기"><span class="msg">${esc(line.message)}</span></button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">조건에 맞는 이력이 없습니다.</td></tr>`;
  $("#history-more").innerHTML = moreBar(historyLines.length, page.total, "history-load-more");
}

$("#history").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act=detail]");
  if (!btn) return;
  try {
    const ev = await api(`/api/events/${btn.closest("tr").dataset.event}`);
    await openEventDetail(ev, { from: $("#h-from").value, to: $("#h-to").value });
  } catch (err) {
    toast(err.message, "error");
  }
});

$("#history-more").addEventListener("click", (e) => {
  if (e.target.id === "history-load-more") loadHistory({ more: true }).catch((err) => toast(err.message, "error"));
});

for (const sel of ["#h-server", "#h-severity", "#h-event", "#h-from", "#h-to"]) {
  $(sel).addEventListener("change", () => {
    renderHistoryEventOptions();
    loadHistory().catch((err) => toast(err.message, "error"));
  });
}

// ---------- 이벤트 상세 ----------
const eventDialog = $("#event-dialog");
let detailEvent = null;
let detailLines = [];
let detailRequest = 0;

function renderEventLines() {
  $("#event-lines").innerHTML = detailLines.map((line, i) => `
    <tr>
      <td class="time small">${esc(new Date(line.seen_at).toLocaleString())}</td>
      <td><div class="msg">${esc(line.message)}</div></td>
      <td class="actions"><button type="button" class="sm" data-copy="${i}">복사</button></td>
    </tr>`).join("") || `<tr><td colspan="3" class="empty">조건에 맞는 이력이 없습니다.</td></tr>`;
}

async function loadDetailLines({ more = false } = {}) {
  const ev = detailEvent;
  const request = ++detailRequest;
  const filtered = $("#event-from").value || $("#event-to").value;
  try {
    const page = await api(historyQuery(
      { event_id: ev.id }, $("#event-from"), $("#event-to"), more ? detailLines.length : 0,
    ));
    if (request !== detailRequest) return;  // 응답 전에 다른 이벤트를 열거나 조건을 바꾼 경우
    if (!page.total && !filtered) {
      // 이력 저장을 시작하기 전의 이벤트에는 저장된 줄이 없음
      detailLines = [{ message: ev.message, seen_at: ev.last_seen }];
      $("#event-note").textContent = "저장된 발생 이력이 없어 최근 로그 1건만 표시합니다.";
      $("#event-more").innerHTML = "";
    } else {
      detailLines = more ? appendLines(detailLines, page.items) : page.items;
      $("#event-note").textContent = filtered
        ? `조회 결과 ${page.total.toLocaleString()}건`
        : page.total < ev.count
          ? `전체 ${ev.count.toLocaleString()}회 중 원본 로그 ${page.total.toLocaleString()}건이 보관되어 있습니다. 나머지는 이력 저장 전에 발생했거나 지워져 볼 수 없습니다.`
          : "";
      $("#event-more").innerHTML = moreBar(detailLines.length, page.total, "event-load-more");
    }
    renderEventLines();
  } catch (err) {
    if (request !== detailRequest) return;
    $("#event-note").textContent = "발생 이력을 불러오지 못했습니다.";
    toast(err.message, "error");
  }
}

$("#event-more").addEventListener("click", (e) => {
  if (e.target.id === "event-load-more") loadDetailLines({ more: true });
});

for (const sel of ["#event-from", "#event-to"]) {
  $(sel).addEventListener("change", () => loadDetailLines());
}

async function openEventDetail(ev, dates = {}) {
  detailEvent = ev;
  $("#event-from").value = dates.from || "";
  $("#event-to").value = dates.to || "";
  $("#event-title").textContent = `${ev.server_name}: ${ev.title}`;
  $("#event-meaning").textContent = ev.description;
  const meta = [
    ["심각도", `<span class="badge b-${esc(ev.severity)}">${esc(ev.severity)}</span>`],
    ["분류", CATEGORY_LABEL[ev.category] || esc(ev.category)],
    ["규칙", esc(ev.rule_id)],
    ["소스", esc(ev.source)],
    ["발생 횟수", `${ev.count}회`],
    ["최초 발생", esc(new Date(ev.first_seen).toLocaleString())],
    ["최근 발생", esc(new Date(ev.last_seen).toLocaleString())],
  ];
  $("#event-meta").innerHTML = meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  // 이력을 받기 전에도, 받지 못해도 저장된 최근 로그는 볼 수 있도록 먼저 표시
  detailLines = [{ message: ev.message, seen_at: ev.last_seen }];
  renderEventLines();
  $("#event-note").textContent = "발생 이력을 불러오는 중...";
  $("#event-more").innerHTML = "";
  eventDialog.showModal();
  await loadDetailLines();
}

$("#event-close").addEventListener("click", () => eventDialog.close());

$("#event-lines").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  // 토스트는 모달에 가려지므로 결과를 버튼에 표시
  try {
    await copyText(detailLines[Number(btn.dataset.copy)].message);
    btn.textContent = "복사됨";
  } catch {
    btn.textContent = "복사 실패";
  }
  setTimeout(() => { btn.textContent = "복사"; }, 1500);
});

$("#events").addEventListener("click", async (e) => {
  const detail = e.target.closest("[data-act=detail]");
  if (detail) return openEventDetail(eventsById.get(Number(detail.closest("tr").dataset.id)));
  const btn = e.target.closest("[data-act=ack]");
  if (!btn) return;
  btn.disabled = true;
  try {
    await api(`/api/events/${btn.closest("tr").dataset.id}/ack`, { method: "POST" });
    await refresh();
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
  }
});

for (const sel of ["#f-server", "#f-severity", "#f-category", "#f-ack"]) {
  $(sel).addEventListener("change", () => { renderServers(); loadEvents().catch((e) => toast(e.message, "error")); });
}
let qTimer;
$("#f-q").addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => loadEvents().catch((e) => toast(e.message, "error")), 300);
});

// ---------- 새로고침 ----------
let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const [summary, list, allEvents] = await Promise.all([
      api("/api/summary"), api("/api/servers"), api("/api/events?limit=1000"),
    ]);
    servers = list;
    historyEvents = allEvents;
    renderSummary(summary);
    renderServers();
    renderHistoryEventOptions();
    await loadEvents();
    // "더 보기"로 펼쳐 읽는 중이면 첫 페이지로 되돌리지 않음
    if (historyLines.length <= HISTORY_PAGE) await loadHistory();
    if (sourcesDialog.open) await loadSources();
    $("#updated").textContent = `마지막 갱신 ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    toast(`데이터를 불러오지 못했습니다: ${err.message}`, "error");
  } finally {
    refreshing = false;
  }
}

$("#refresh").addEventListener("click", refresh);
setInterval(() => {
  if ($("#auto").checked && !dialog.open && !document.hidden) refresh();
}, 10000);
refresh();
</script>
